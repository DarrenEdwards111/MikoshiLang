[build-system]
requires = ["setuptools>=61.0,<75"]
build-backend = "setuptools.build_meta"

[project]
name = "mikoshilang"
version = "3.8.0"
description = "Wolfram-style symbolic computing for Python, with opt-in types, Python interop and independent verification of results"
authors = [{name = "Mikoshi Ltd", email = "mikoshiuk@gmail.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
readme = "README.md"
keywords = ["symbolic-computation", "computer-algebra", "pattern-matching", "mathematics", "wolfram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.13", "numpy>=1.21", "requests>=2.28"]

[project.optional-dependencies]
jupyter = ["ipykernel>=6.0", "matplotlib>=3.4", "nest-asyncio>=1.5"]
signal = ["scipy>=1.7"]
plotting = ["matplotlib>=3.4"]
visualization = ["matplotlib>=3.4", "plotly>=5.0"]
chemistry = []
units = []
test = ["pytest>=7", "hypothesis>=6"]
all = ["ipykernel>=6.0", "matplotlib>=3.4", "scipy>=1.7", "plotly>=5.0", "networkx>=2.6", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/DarrenEdwards111/MikoshiLang"
Repository = "https://github.com/DarrenEdwards111/MikoshiLang"
Documentation = "https://github.com/DarrenEdwards111/MikoshiLang/tree/main/docs"
Changelog = "https://github.com/DarrenEdwards111/MikoshiLang/blob/main/CHANGELOG.md"
Issues = "https://github.com/DarrenEdwards111/MikoshiLang/issues"

[project.scripts]
mikoshilang = "mikoshilang.repl:main"
mikoshilang-install-kernel = "mikoshilang.jupyter.install:main"

[tool.setuptools.packages.find]
# Discover every subpackage (mikoshilang.library, mikoshilang.jupyter, ...). A hand-written list
# silently dropped mikoshilang.library from the wheel, so `import mikoshilang` failed after install.
include = ["mikoshilang*"]

[tool.setuptools.data-files]
"share/mikoshilang/manual" = ["manual/*.pdf", "manual/*.tex", "manual/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_service'"
markers = ["live_service: depends on external knowledge APIs and mutable remote data"]

[tool.setuptools.package-data]
mikoshilang = ["quarantined.json"]
"mikoshilang.jupyter" = ["kernel.json"]
