name: Public Python API robustness

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install scientific and property-test dependencies
        run: python -m pip install '.[all,test]' build
      - name: Test source public API and inventory
        run: >-
          python -m pytest -q tests/test_public_api_*.py tests/test_python_*_regressions.py
          --tb=short --junitxml="$RUNNER_TEMP/public-api-source.xml"
      - name: Build and install wheel
        run: |
          python -m build --outdir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel outside the checkout
        run: >-
          python scripts/check_public_api_wheel.py --work-dir "$RUNNER_TEMP"
          --junitxml "$RUNNER_TEMP/public-api-wheel.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-api-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/public-api-*.xml
          if-no-files-found: ignore

  public-api-minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install without optional scientific or property-test dependencies
        run: python -m pip install . pytest build
      - name: Test minimal source install
        run: >-
          python -m pytest -q tests/test_public_api_*.py tests/test_python_*_regressions.py
          --tb=short --junitxml="$RUNNER_TEMP/public-api-source.xml"
      - name: Build and install minimal wheel
        run: |
          python -m build --outdir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test minimal wheel outside the checkout
        run: >-
          python scripts/check_public_api_wheel.py --work-dir "$RUNNER_TEMP"
          --junitxml "$RUNNER_TEMP/public-api-wheel.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-api-minimal-${{ matrix.os }}
          path: ${{ runner.temp }}/public-api-*.xml
          if-no-files-found: ignore
