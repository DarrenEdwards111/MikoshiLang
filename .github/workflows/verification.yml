name: Verification
# Executable Check: lines (mikoshilang/verification.py). The stated checks and the identity/mpmath/NumPy tables
# take well under a minute, so they run on every push and pull request; the full run (every audited head's
# reference cases) is the size of the test suite and runs weekly or on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
jobs:
  stated:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[all,test]'
      - run: python scripts/verify_library.py --markdown verification_report.md
        env:
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-stated
          path: verification_report.md
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[all,test]'
      - run: python scripts/verify_library.py --all --markdown verification_report.md --json verification_report.json
        env:
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-full
          path: |
            verification_report.md
            verification_report.json
